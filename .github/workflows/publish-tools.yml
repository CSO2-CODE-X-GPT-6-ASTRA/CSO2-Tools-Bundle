name: Publish tool releases

on:
  push:
    branches: [main]
    paths:
      - '*.pyw'
      - '**/*.pyw'
      - 'CSO2 Bot Tool/1 - Shoot Through Data 射击穿透数据/**'
      - 'CSO2 Bot Tool/2 - Python Libs 依赖包/**'
      - '.github/workflows/publish-tools.yml'
      - '.github/scripts/publish_tools.py'
      - '.github/scripts/publish_bundle.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tools
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover versioned scripts and publish verified attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOL_REPOSITORY_ID: ${{ github.repository_id }}
        run: python .github/scripts/publish_bundle.py
